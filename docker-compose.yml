services:
  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: nginx
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - ft_transcendence

  backend:
    build: ./backend
    container_name: backend
    expose:
      - "3000"
    env_file:
      - .env
    depends_on:
      - db
      - engine
    networks:
      - ft_transcendence
    restart: on-failure

  engine:
    build: ./engine
    container_name: engine
    expose:
      - "5000"
    networks:
      - ft_transcendence
    restart: on-failure


  db:
    build: ./db
    container_name: db
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data:Z
    networks:
      - ft_transcendence

networks:
  ft_transcendence:
    driver: bridge

volumes:
  pgdata:
